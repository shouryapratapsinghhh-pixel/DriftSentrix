# Ablation sweep: window x hidden/d_model x score_mode, for LSTM-AE and Transformer-AE.
# Deliberately small (synthetic_n_train/test, max_epochs) so the full 48-setting grid
# finishes in a few minutes on CPU. One seed here -- seed variance is seed_stats_table's job,
# run separately with more seeds if you want CIs on top of the ablation itself.
dataset: synthetic
root: null
entities: all
synthetic_n_train: 400
synthetic_n_test: 300
synthetic_d: 3
seeds:
- 0
models:
- name: lstm_ae
  label: lstm_ae_w16_h32_window_mean
  params:
    window: 16
    hidden: 32
    layers: 1
    latent: 8
    batch_size: 64
    max_epochs: 8
    patience: 3
    score_mode: window_mean
- name: transformer_ae
